<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten LINKify</title>
    <meta name="description" content="Assisten Linkify">
  <meta property="og:title" content="Cs - LINKify">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-linkify.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="chat-container">
        <header>
            <div class="avatar">Cs</div>
            <div>
                <h2>Assisten Linkify</h2>
                <p>Online</p>
            </div>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message ai-message">Ada yang bisa di bantu atau kendala lain di Linkify?</div>
        </div>
        <div style="display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: rgba(20,22,37,0.9);">
    <button type="button" onclick="sendQuickAction('🚀 Cara Mulai?')" style="width: auto; height: auto; padding: 6px 12px; border-radius: 12px; font-size: 12px; background: rgba(255,255,255,0.1);">🚀 Cara Mulai?</button>
    <button type="button" onclick="sendQuickAction('💎 Upgrade Premium')" style="width: auto; height: auto; padding: 6px 12px; border-radius: 12px; font-size: 12px; background: rgba(255,255,255,0.1);">💎 Upgrade Premium</button>
    <button type="button" onclick="sendQuickAction('📸 Cara Upload Foto')" style="width: auto; height: auto; padding: 6px 12px; border-radius: 12px; font-size: 12px; background: rgba(255,255,255,0.1);">📸 Cara Upload Foto</button>
</div>
        <form id="chat-form" class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autocomplete="off" required>
            </div>
            <button type="submit" id="btn-submit">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

    <script src="config/config.js"></script>
</body>
</html>
