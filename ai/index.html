<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asisten LINKify</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="../logo-linkify.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="chat-header" id="chat-header">
    <button class="header-back" id="btn-back" aria-label="Kembali">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <div class="header-avatar" aria-hidden="true">
      <img src="../logo-linkify.png" alt="LINKify" class="avatar-img" onerror="this.style.display='none';this.parentElement.textContent='L'">
      <span class="avatar-online" aria-label="Online"></span>
    </div>
    <div class="header-info">
      <div class="header-name">Asisten Bot LINKify</div>
      <div class="header-status" id="header-status">
        <span class="status-dot"></span>
        Online
      </div>
    </div>
    <button class="header-menu" id="btn-menu" aria-label="Menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </header>

  <!-- CHAT MESSAGES -->
  <main class="chat-body" id="chat-body" role="log" aria-live="polite" aria-label="Percakapan">
    <!-- messages injected by JS -->
  </main>

  <!-- QUICK REPLIES -->
  <div class="quick-replies-wrap" id="quick-replies-wrap" role="complementary" aria-label="Pertanyaan cepat">
    <div class="quick-replies" id="quick-replies">
      <!-- injected by JS -->
    </div>
  </div>

  <!-- INPUT BAR -->
  <footer class="chat-footer" id="chat-footer">
    <div class="input-wrap">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Ketik pesan di sini..."
        rows="1"
        maxlength="500"
        aria-label="Ketik pesan"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>
      <button type="button" id="btn-send" class="send-btn" aria-label="Kirim pesan" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M22 2L11 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </footer>

  <script src="botJs/bot.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
