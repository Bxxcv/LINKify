<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Toko — LINKify Dashboard</title>
  <meta name="description" content="Masuk ke dashboard LINKify untuk mengelola produk, profil toko, dan analitik pengunjung.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://linkify-linkbio.vercel.app/login-user">
  <meta name="theme-color" content="#534EE4">
  <link rel="icon" type="image/png" sizes="32x32" href="/asset/icon.png">
  <link rel="apple-touch-icon" href="/asset/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260523">
  
  <link rel="stylesheet" href="css/saas-polish.css?v=20260602">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body.login-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAFA; /* Warna background abu-abu sangat terang */
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.03), 0 1px 8px rgba(0,0,0,.03);
    }
    .login-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 8px;
      color: #1F2937;
    }
    .login-sub {
      font-size: 14px;
      color: #6B7280;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .login-fields {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }
    .login-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1F2937;
      background: #F9FAFB;
      outline: none;
      transition: all 0.2s ease;
    }
    /* Padding khusus untuk input password agar tidak menabrak ikon mata */
    input#password {
      padding-right: 45px; 
    }
    .login-input:focus {
      border-color: #534EE4;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(83, 78, 228, 0.1);
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-password:hover {
      color: #4B5563;
    }
    .toggle-password svg {
      width: 20px;
      height: 20px;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #534EE4; /* Warna ungu/biru sesuai screenshot */
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover {
      background: #4338CA;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      font-size: 13px;
      color: #EF4444;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
      line-height: 1.5;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #6B7280;
    }
    .login-footer a {
      color: #534EE4;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-footer a:hover {
      color: #4338CA;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media(max-width: 440px) {
      .login-wrap { padding: 32px 24px; }
      body.login-page { padding: 16px; }
    }
  </style>
</head>
<body class="login-page">
  <main>
    <div class="login-wrap" role="main">
      <h1 class="login-title">Selamat Datang! 👋</h1>
      <p class="login-sub">Masuk ke dashboard toko LINKify.</p>

      <div class="login-fields">
        <div>
          <label class="login-label" for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="nama@email.com"
                 class="login-input" aria-required="true" aria-label="Alamat email">
        </div>
        <div>
          <label class="login-label" for="password">Password</label>
          <div class="input-wrapper">
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
                   class="login-input" aria-required="true" aria-label="Password">
            
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="button" id="loginBtn" class="login-btn" aria-label="Masuk ke dashboard toko">
        Masuk ke Dashboard
      </button>
      
      <p id="errorMsg" class="login-error" role="alert" aria-live="polite"></p>

      <div class="login-footer">
        Lupa password? <a href="https://wa.me/6285191245042" target="_blank">Hubungi admin</a>
      </div>
    </div>
  </main>

  <script defer src="./js/login-ui.js?v=20260602"></script>

  <script type="module" src="./js/maintenance-check.bootstrap.js?v=20260602"></script>
  <script type="module" src="js/login-user.js"></script>
</body>
</html>
